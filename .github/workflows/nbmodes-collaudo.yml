# NBMODES-IC8TEM - collaudo build (IC8TEM). A push to branch "collaudo" builds the Windows x64 installer
# with the WSJT-X 3.3 Windows pipeline (Windows 7 API floor 0x0601) and puts it in a DRAFT release,
# visible only to the repository owner and never offered by the automatic updater.
name: NBMODES-IC8TEM collaudo

on:
  push:
    branches: [collaudo]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      version: 1.0.0-collaudo4
      hamlib_branch: "4.7.2"
      artifact_retention_days: 30

  draft:
    needs: windows
    runs-on: ubuntu-latest
    env:
      NBM_VERSION: 1.0.0-collaudo4
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wsjtx-1.0.0-collaudo4-windows-x86_64-installer
          path: out
      - name: Draft release (owner only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          cat > notes.md <<'NOTE'
          Versione di collaudo, solo per IC8TEM. Base WSJT-X 3.3.0-beta8 (K1JT e WSJT Development Group, GPLv3).

          Collaudo4: nuova interfaccia dai bozzetti (barra NBMODES-IC8TEM, fascia dei modi, temi Chiaro/Notte/Nero/Pastello azzurro/Scia meteorica
          in Vista > Tema, carattere Inter incorporato al 90%, pulsanti di banda e di modo con i colori del tema).
          TCI: radio "TCI-client1" e "TCI-client2", ognuna con il proprio indirizzo (40001 ExpertSDR3/SunSDR, 50001 Thetis); "#2" in fondo
          all'indirizzo sceglie il secondo ricevitore. JT4 tolto dai menu.

          Collaudo3: tutto con il nome NBMODES (installatore NBMODES-IC8TEM 1.0.0 in C:\\NBMODES-IC8TEM, nbmodes.exe,
          nbmodes-decoder.exe, schermata d'avvio e Informazioni con i crediti). Non tocca WSJT-X ne' il PATH.
          Se e' installata la versione con i nomi di WSJT-X ("wsjtx 3.3.0" in C:\\wsjtx), disinstallarla prima: le impostazioni restano.

          Novita' rispetto a collaudo1:
          - FT8: decoder multithread (JTDX ft8var) di default + passaggio in piu' superldpc (Decodium, GPLv3)
          - Q65: forma dello spread (Gauss/Lorentz/entrambe) e unione dei bin x2/x4 per spread larghi
          - Adattamento automatico al computer (CPU, Windows, monitor) e popup di chiusura
          - Icona NBMODES
          - Elenco esclusi senza limiti, con call barrati; "Nascondi chi non usa LoTW"
          - CSV LoTW e CALL3.TXT aggiornati ogni giorno (regole LIVETROPOVHF), locatori mancanti da G7VRD
          - Decoder adattato alla potenza del PC (menu Decodifica)
          - RAM: aree audio occupate solo quando servono (finestra a riposo ~180 MB invece di ~280), elenco LoTW compatto
          - FST4, FST4W e JTTY tolti dai menu; thread FT8 "Auto" secondo la RAM (2 con 4 GB, 4 con 8 GB)
          - GPU: rilevata all'avvio; waterfall e spettro in OpenGL quando conviene (menu Visualizza)
          - Con RAM libera sotto 500 MB: riduzioni automatiche a gradini

          Da collaudare: FT8 e FT4 in HF.
          NOTE
          sed -i 's/^          //' notes.md
          for f in out/*.exe; do mv "$f" "out/NBMODES-IC8TEM-${NBM_VERSION}-windows-x64-setup.exe"; done
          gh release delete "v${NBM_VERSION}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${NBM_VERSION}" --repo "${{ github.repository }}" --draft --prerelease \
            --target "${{ github.sha }}" --title "NBMODES-IC8TEM ${NBM_VERSION} (collaudo)" \
            --notes-file notes.md \
            out/*.exe
